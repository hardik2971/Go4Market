name: customer_app
description: "Go4Market customer app - multi-vendor, multi-module marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  g4m_core:
    path: ../../packages/g4m_core

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

  # Platform
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  speech_to_text: ^7.4.0
  razorpay_flutter: ^1.4.7
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  http: ^1.6.0

  # UI
  cupertino_icons: ^1.0.8
  animations: ^2.2.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.2
  google_sign_in: ^7.2.0

dependency_overrides:
  # g4m_core asks for intl ^0.20.3 but flutter_localizations (SDK) pins 0.20.2.
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F3FBF6"
  image: assets/brand/logo.png
  color_dark: "#0B1410"
  image_dark: assets/brand/logo.png
  android_12:
    image: assets/brand/splash_android12.png
    color: "#F3FBF6"
    icon_background_color: "#FFFFFF"
    image_dark: assets/brand/splash_android12.png
    color_dark: "#0B1410"
    icon_background_color_dark: "#FFFFFF"
  android: true
  ios: true
  fullscreen: false
