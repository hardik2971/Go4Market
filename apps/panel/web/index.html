<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Patched per panel by tool/build_all.ps1 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="description" content="Go4Market Admin – marketplace control panel">
  <meta name="theme-color" content="#0B8A4F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Go4Market Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Go4Market Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F7FAF8; }
    @media (prefers-color-scheme: dark) { html, body { background: #0B1410; } }
    #g4m-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, sans-serif; transition: opacity .35s ease; z-index: 9; }
    #g4m-splash img { width: 72px; height: 72px; animation: g4m-pop 1.6s ease-in-out infinite; }
    #g4m-splash .bar { width: 160px; height: 4px; border-radius: 4px; background: #E3EBE6; overflow: hidden; }
    #g4m-splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: var(--g4m-accent, #0B8A4F); animation: g4m-slide 1.1s ease-in-out infinite; }
    #g4m-splash .label { font-size: 13px; font-weight: 700; color: #5B6B62; letter-spacing: .4px; }
    @keyframes g4m-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @keyframes g4m-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>
  <div id="g4m-splash"><img src="icons/Icon-192.png" alt="Go4Market"><div class="bar"></div><div class="label" id="g4m-splash-label">Go4Market Admin</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('g4m-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
